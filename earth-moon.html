<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Earth &amp; Moon</title>
<meta name="description" content="A draggable Earth and Moon: watch the Moon orbit, the Earth spin, and day turn to night.">
<meta name="theme-color" content="#05070f">
<style>
  :root { --text: #f5f5f7; --muted: #a1a1a6; --accent: #2997ff; --panel: rgba(18, 20, 30, .74); --line: rgba(255,255,255,.14); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #05070f; color: var(--text); overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased; font-size: 15px; line-height: 1.4; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  #sky { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #sky.dragging { cursor: grabbing; }
  .hud { position: fixed; left: 0; right: 0; padding: 0 16px; pointer-events: none; }
  .hud > * { pointer-events: auto; }
  .top { top: 0; padding-top: max(14px, env(safe-area-inset-top)); }
  .top .row { display: flex; align-items: baseline; gap: 14px; }
  .top .back { font-size: 14px; color: var(--muted); }
  .top .back:hover { color: var(--text); text-decoration: none; }
  .top h1 { font-size: 18px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
  .top p { margin: 4px 0 0; font-size: 13px; color: var(--muted); max-width: 440px; }
  .bottom { bottom: 0; padding-bottom: max(14px, env(safe-area-inset-bottom)); display: flex; justify-content: center; }
  .panel { width: min(100%, 560px); background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); padding: 10px 14px 12px;
    display: grid; grid-template-columns: auto 1fr auto; grid-template-rows: auto auto; gap: 6px 14px; align-items: center; }
  .panel button { appearance: none; border: 1px solid var(--line); background: rgba(255,255,255,.06); color: var(--text);
    border-radius: 980px; width: 40px; height: 40px; display: grid; place-items: center; cursor: pointer; padding: 0; }
  .panel button:hover { background: rgba(255,255,255,.12); }
  .panel button svg { width: 18px; height: 18px; fill: currentColor; }
  .panel svg[hidden] { display: none; }
  .speed { display: flex; align-items: center; gap: 6px; min-width: 0; flex-wrap: wrap; }
  .speed span { font-size: 12px; color: var(--muted); margin-right: 4px; }
  .panel .speed button { width: auto; height: 30px; padding: 0 11px; font-size: 13px; }
  .panel .speed button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  #play { grid-column: 1; grid-row: 1; }
  .speed { grid-column: 2; grid-row: 1; }
  #phase { width: 48px; height: 48px; grid-column: 3; grid-row: 1 / 3; }
  .read { grid-column: 1 / 3; grid-row: 2; font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 14px; }
  .read b { color: var(--text); font-weight: 500; }
  .tools { position: absolute; right: 14px; top: -34px; display: flex; gap: 8px; }
  .bottom { position: fixed; }
  .panel { position: relative; }
  .tools button { width: auto; height: 28px; padding: 0 12px; font-size: 12px; border-radius: 980px; }
  @media (max-width: 480px) { .top p { font-size: 12px; } .read { font-size: 12px; } .speed span { display: none; } .speed { gap: 4px; } .panel .speed button { padding: 0 7px; font-size: 12px; } }
</style>
</head>
<body>
<canvas id="sky" aria-label="Earth and Moon simulation"></canvas>

<div class="hud top">
  <div class="row"><a class="back" href="/">&larr; Ben Sirb</a><h1>Earth &amp; Moon</h1></div>
  <p>Drag the Moon along its orbit. Drag the Earth to spin it. Drag the background to tilt the view. The Sun sits far off to the right; let a year run at 32× to watch the Earth's tilt swing through the seasons.</p>
</div>

<div class="hud bottom">
  <div class="panel">
    <div class="tools"><button id="reset" type="button">Reset</button></div>
    <button id="play" type="button" aria-label="Pause">
      <svg id="ico-pause" viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
      <svg id="ico-play" viewBox="0 0 24 24" hidden><path d="M8 5v14l11-7z"/></svg>
    </button>
    <div class="speed" role="group" aria-label="Simulation speed">
      <span>Speed</span>
      <button type="button" data-speed="1" aria-pressed="true">1×</button>
      <button type="button" data-speed="2" aria-pressed="false">2×</button>
      <button type="button" data-speed="4" aria-pressed="false">4×</button>
      <button type="button" data-speed="8" aria-pressed="false">8×</button>
      <button type="button" data-speed="32" aria-pressed="false">32×</button>
    </div>
    <canvas id="phase" title="The Moon as seen from Earth"></canvas>
    <div class="read"><span id="read1"></span><span id="read2"></span></div>
  </div>
</div>

function makeEarthTexture() {
  const TW = 1024, TH = 512, c = document.createElement('canvas'); c.width = TW; c.height = TH;
  const g = c.getContext('2d');
  const X = (lon) => (lon + 180) / 360 * TW, Y = (lat) => (90 - lat) / 180 * TH;
  const ocean = g.createLinearGradient(0, 0, 0, TH);
  ocean.addColorStop(0, '#15325f'); ocean.addColorStop(0.5, '#1b5aa5'); ocean.addColorStop(1, '#15325f');
  g.fillStyle = ocean; g.fillRect(0, 0, TW, TH);
  const land = g.createLinearGradient(0, 0, 0, TH);
  [[75, '#8a9a86'], [55, '#4a7d3a'], [38, '#6f9a46'], [24, '#c2a86a'], [10, '#3f8f3c'], [-5, '#3c8a3a'], [-24, '#b89f66'], [-40, '#5e8f48'], [-56, '#7f9a8a']]
    .forEach(([lat, col]) => land.addColorStop((90 - lat) / 180, col));
  const poly = (pts, fill) => {
    g.beginPath(); pts.forEach(([lo, la], i) => (i ? g.lineTo(X(lo), Y(la)) : g.moveTo(X(lo), Y(la)))); g.closePath();
    g.fillStyle = fill; g.fill();
  };
  LAND.forEach((p) => poly(p, land));
  SEAS.forEach((p) => poly(p, ocean));
  const ice = '#e9eef5';
  ICE.forEach((p) => poly(p, ice));
  g.fillStyle = ice; g.fillRect(0, 0, TW, Y(80)); g.fillRect(0, Y(-66), TW, TH - Y(-66));
  const d = g.getImageData(0, 0, TW, TH).data;
  return { W: TW, H: TH, data: d };

  const { size, img } = sp, d = img.data, R = size / 2;

  const [m00, m01, m02, m10, m11, m12, m20, m21, m22] = M;
  const sx = SUN[0], sy = SUN[1], sz = SUN[2];
  let hx = sx, hy = sy - ce, hz = sz + se; const hl = Math.hypot(hx, hy, hz); hx /= hl; hy /= hl; hz /= hl;
  const TW = tex.W, TH = tex.H, td = tex.data;
  let i = 0;
  for (let py = 0; py < size; py++) {
    const vy = (R - py - 0.5) / R;
    for (let px = 0; px < size; px++, i += 4) {
      const vx = (px + 0.5 - R) / R, rr = vx * vx + vy * vy;
      if (rr >= 1) { d[i + 3] = 0; continue; }
      const vz = Math.sqrt(1 - rr);
      const nx = vx, ny = vy * se - vz * ce, nz = vy * ce + vz * se;
      const bx = m00 * nx + m01 * ny + m02 * nz, by = m10 * nx + m11 * ny + m12 * nz, bz = m20 * nx + m21 * ny + m22 * nz;
      const lat = Math.asin(bz > 1 ? 1 : bz < -1 ? -1 : bz), lon = Math.atan2(by, bx);
      let tx = ((lon / TAU + 0.5) * TW) | 0; if (tx >= TW) tx = TW - 1; else if (tx < 0) tx = 0;
      let ty = ((0.5 - lat / Math.PI) * TH) | 0; if (ty >= TH) ty = TH - 1; else if (ty < 0) ty = 0;
      const k = (ty * TW + tx) * 4, tr = td[k], tg = td[k + 1], tb = td[k + 2];
      const L = nx * sx + ny * sy + nz * sz;
      let day = (L + o.soft0) / o.softW; day = day < 0 ? 0 : day > 1 ? 1 : day * day * (3 - 2 * day);
      const kd = (o.ambient + (1 - o.ambient) * day) * (o.limb + (1 - o.limb) * vz);
      let spec = 0;
      if (o.spec && tb > tr + 40) { const nh = nx * hx + ny * hy + nz * hz; if (nh > 0) spec = Math.pow(nh, 50) * o.spec * day; }
      d[i] = tr * kd + spec + (1 - day) * o.nr;
      d[i + 1] = tg * kd + spec + (1 - day) * o.ng;
      d[i + 2] = tb * kd + spec + (1 - day) * o.nb;
      const edge = (1 - Math.sqrt(rr)) * R + 0.5;
      d[i + 3] = edge >= 1 ? 255 : edge * 255;

}

// ---------- state helpers ----------
// In this Sun-fixed frame the axis direction swings around once a year (clockwise, since the Earth
// orbits counterclockwise), and the spin about the axis runs at the sidereal rate so that the Sun
// still returns to a meridian once per mean solar day.
const phi = () => -TAU * (t - T_JUNE) / YEAR;             // tilt direction: toward the Sun at the June solstice
const theta = () => THETA0 + TAU * t * (1 + 1 / YEAR);    // Earth spin about its axis (sidereal)
const bodyToWorld = () => mul(Rz(phi()), mul(Ry(TILT), Rz(theta())));
const alpha = () => TAU * (t - T_NEW) / SYNODIC;          // Moon orbit angle (longitude) from the Sun direction
// The Moon's orbit is inclined 5.14 degrees to the Earth's. Its line of nodes holds still in space apart from
// a slow regression (one turn per 18.61 years), so in this Sun-fixed frame the nodes turn once a year plus that.
const MOON_INC = 5.145 * D2R, NODE_PERIOD = 18.61 * YEAR;
const Rx = (a) => { const c = Math.cos(a), s = Math.sin(a); return [1, 0, 0, 0, c, -s, 0, s, c]; };
const nodeLon = () => -TAU * t / YEAR - TAU * t / NODE_PERIOD;
const orbitToWorld = () => mul(Rz(nodeLon()), Rx(MOON_INC));
// Position on the orbit, in Earth radii = 1, for a longitude `lon` measured from the Sun direction.
const moonPos = (lon, O2W, om) => apply(O2W, [Math.cos(lon - om), Math.sin(lon - om), 0]);
const fastRunning = () => playing && !drag && speed > BASE_SPEED * 1.001;
const phaseFrac = () => ((((t - T_NEW) % SYNODIC) + SYNODIC) % SYNODIC) / SYNODIC;
// Pick THETA0 so that t = 0 is mean midnight in Atlanta.
const THETA0 = (() => { const s = apply(mul(Ry(-TILT), Rz(-TAU * T_JUNE / YEAR)), SUN); return Math.atan2(s[1], s[0]) - ATL.lon - Math.PI; })();
function calendar() {
  let d = Math.floor((((t % YEAR) + YEAR) % YEAR)); let m = 0;
  while (m < 11 && d >= MONTH_DAYS[m]) { d -= MONTH_DAYS[m]; m++; }
  const doy = (((t % YEAR) + YEAR) % YEAR);
  const season = doy < 80.2 || doy >= 354.1 ? 'winter' : doy < T_JUNE ? 'spring' : doy < 262.8 ? 'summer' : 'autumn'; // northern, from the sim's own solstice
  return { label: `${MONTHS[m]} ${d + 1}`, season };
}
function phaseName(f) {
  const q = [[0, 'New moon'], [0.25, 'First quarter'], [0.5, 'Full moon'], [0.75, 'Last quarter'], [1, 'New moon']];
  for (const [p, n] of q) if (Math.abs(f - p) < 0.02) return n;
  return f < 0.25 ? 'Waxing crescent' : f < 0.5 ? 'Waxing gibbous' : f < 0.75 ? 'Waning gibbous' : 'Waning crescent';
}
function atlantaWorld() {
  const cl = Math.cos(ATL.lat);
  return apply(bodyToWorld(), [cl * Math.cos(ATL.lon), cl * Math.sin(ATL.lon), Math.sin(ATL.lat)]);
}
const toScreen = ([x, y, z], r) => [cx + x * r, cy - (y * Math.sin(elev) + z * Math.cos(elev)) * r];
const depth = ([, y, z]) => -y * Math.cos(elev) + z * Math.sin(elev);

// ---------- layout ----------
function makeStars() {
  const c = document.createElement('canvas'); c.width = Math.round(W * DPR); c.height = Math.round(H * DPR);
  const g = c.getContext('2d'); g.scale(DPR, DPR);
  let s = 42; const rnd = () => ((s = (s * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff);
  const n = Math.round(W * H * 0.00045);
  for (let i = 0; i < n; i++) {
    const r = 0.35 + rnd() * 1.1, a = 0.25 + rnd() * 0.65;
    g.fillStyle = rnd() < 0.12 ? `rgba(190,210,255,${a})` : `rgba(255,255,255,${a})`;
    g.beginPath(); g.arc(rnd() * W, rnd() * H, r, 0, TAU); g.fill();
  }
  return c;
}
function layout() {
  const topH = els.top.getBoundingClientRect().bottom + 6;
  const bottomH = H - els.panel.getBoundingClientRect().top + 44;
  sunR = Math.max(26, Math.min(64, 0.08 * Math.min(W, H)));
  const sunClear = sunR * 0.75 + 14;
  cx = (W - sunClear) / 2 + 6;
  const availH = Math.max(120, H - topH - bottomH);
  cy = topH + availH / 2;
  Re = Math.min(0.12 * Math.min(W, H), 100);
  Mr = MOON_RATIO * Re;
  Rm = Math.min(cx - Mr - 14, W - sunClear - cx - Mr - 8, (availH / 2 - Mr - 6) / Math.max(Math.sin(elev), 0.25));
  if (Rm < 3 * Re) { Re = Rm / 3; Mr = MOON_RATIO * Re; }
  if (!earthSp || earthSp.diam !== 2 * Re) earthSp = sprite(2 * Re);
  if (!moonSp || moonSp.diam !== 2 * Mr) moonSp = sprite(2 * Mr);
  dirty = true;
}
function resize() {
  W = Math.max(1, innerWidth); H = Math.max(1, innerHeight); DPR = Math.min(2, devicePixelRatio || 1);
  sky.width = Math.round(W * DPR); sky.height = Math.round(H * DPR);
  phaseC.width = phaseC.height = Math.round(48 * DPR);
  stars = makeStars(); earthSp = moonSp = null;
  layout();
}

// ---------- drawing ----------
function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#05070f'; ctx.fillRect(0, 0, W, H);
  ctx.drawImage(stars, 0, 0, W, H);
  const se = Math.sin(elev), a = alpha(), B2W = bodyToWorld();

  // Sun, far off to the right
  const sunX = W + sunR * 0.25, sunY = cy;
  let g = ctx.createRadialGradient(sunX, sunY, sunR * 0.6, sunX, sunY, sunR * 4.5);
  g.addColorStop(0, 'rgba(255,214,130,.55)'); g.addColorStop(0.3, 'rgba(255,190,90,.14)'); g.addColorStop(1, 'rgba(255,170,60,0)');
  ctx.fillStyle = g; ctx.fillRect(sunX - sunR * 4.5, sunY - sunR * 4.5, sunR * 9, sunR * 9);
  g = ctx.createRadialGradient(sunX - sunR * 0.3, sunY - sunR * 0.3, 0, sunX, sunY, sunR);
  g.addColorStop(0, '#fff6d0'); g.addColorStop(1, '#ffc24a');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(sunX, sunY, sunR, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(245,245,247,.7)'; ctx.font = '12px -apple-system, BlinkMacSystemFont, "SF Pro Text", Helvetica, Arial, sans-serif';
  ctx.textAlign = 'right'; ctx.fillText('Sun', W - 14, sunY + sunR + 18);
  ctx.fillStyle = 'rgba(161,161,166,.8)'; ctx.font = '11px -apple-system, BlinkMacSystemFont, "SF Pro Text", Helvetica, Arial, sans-serif';
  if (W >= 600) ctx.fillText('390× farther than the Moon', W - 14, sunY + sunR + 33);

  // Moon orbit: far half now, near half after the Earth
  const O2W = orbitToWorld(), om = nodeLon();
  const orbitHalf = (front) => {
    ctx.setLineDash([3, 6]); ctx.lineWidth = 1; ctx.strokeStyle = front ? 'rgba(255,255,255,.4)' : 'rgba(255,255,255,.2)';
    ctx.beginPath(); let pen = false;
    for (let i = 0; i <= 240; i++) {
      const p = moonPos(TAU * i / 240, O2W, om);
      if ((depth(p) > 0) !== front) { pen = false; continue; }
      const [x, y] = toScreen(p, Rm); if (pen) ctx.lineTo(x, y); else ctx.moveTo(x, y); pen = true;
    }
    ctx.stroke(); ctx.setLineDash([]);
  };
  orbitHalf(false);

  // Earth axis (full line behind, the near tip redrawn in front)
  const axis = apply(B2W, [0, 0, 1]);
  const axisPt = (k) => toScreen([axis[0] * k, axis[1] * k, axis[2] * k], Re);
  const northFront = depth(axis) > 0;
  ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1; ctx.setLineDash([2, 4]);
  ctx.beginPath(); ctx.moveTo(...axisPt(-1.35)); ctx.lineTo(...axisPt(1.35)); ctx.stroke(); ctx.setLineDash([]);

  const moonW = moonPos(a, O2W, om);
  const [mx, my] = toScreen(moonW, Rm);
  const moonFront = depth(moonW) > 0;
  const drawMoon = () => {
    renderSphere(moonSp, MOON_TEX, Rz(-(Math.atan2(moonW[1], moonW[0]) + Math.PI)), MOON_SHADE); // near side faces Earth
    ctx.drawImage(moonSp.c, mx - Mr, my - Mr, 2 * Mr, 2 * Mr);
  };
  if (!moonFront) drawMoon();

  // Earth
  g = ctx.createRadialGradient(cx, cy, Re * 0.9, cx, cy, Re * 1.16);
  g.addColorStop(0, 'rgba(110,175,255,0)'); g.addColorStop(0.42, 'rgba(110,175,255,.38)'); g.addColorStop(1, 'rgba(110,175,255,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, Re * 1.16, 0, TAU); ctx.fill();
  renderSphere(earthSp, EARTH_TEX, transpose(B2W), EARTH_SHADE);
  ctx.drawImage(earthSp.c, cx - Re, cy - Re, 2 * Re, 2 * Re);
  ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 1.2;
  const near = northFront ? 1 : -1;
  ctx.beginPath(); ctx.moveTo(...axisPt(near)); ctx.lineTo(...axisPt(near * 1.35)); ctx.stroke();
  ctx.fillStyle = northFront ? 'rgba(245,245,247,.8)' : 'rgba(245,245,247,.45)'; ctx.font = '11px -apple-system, BlinkMacSystemFont, "SF Pro Text", Helvetica, Arial, sans-serif';
  ctx.textAlign = 'center'; const [nx, ny] = axisPt(1.55); ctx.fillText('N', nx, ny + 4);

  // Atlanta marker
  const atl = atlantaWorld();
  if (depth(atl) > 0.04) {
    const [px, py] = toScreen(atl, Re);
    ctx.beginPath(); ctx.arc(px, py, 3.5, 0, TAU); ctx.fillStyle = '#ff5a4a'; ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 1.2; ctx.stroke();
    ctx.font = '11px -apple-system, BlinkMacSystemFont, "SF Pro Text", Helvetica, Arial, sans-serif'; ctx.textAlign = 'left';
    if (!fastRunning()) { ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillText('Atlanta', px + 8, py + 5); ctx.fillStyle = '#fff'; ctx.fillText('Atlanta', px + 7, py + 4); }
  }

  orbitHalf(true);
  if (moonFront) drawMoon();

  drawPhase(a);
  updateReadout(atl);
}

function drawPhase(a) {
  const s = phaseC.width / DPR, r = s * 0.42, x = s / 2, y = s / 2, c = Math.cos(a), waxing = Math.sin(a) >= 0;
  pg.setTransform(DPR, 0, 0, DPR, 0, 0); pg.clearRect(0, 0, s, s);
  pg.fillStyle = '#2b2d35'; pg.beginPath(); pg.arc(x, y, r, 0, TAU); pg.fill();
  pg.fillStyle = '#e9e7df'; pg.beginPath();
  if (waxing) {
    pg.arc(x, y, r, -Math.PI / 2, Math.PI / 2);
    if (c > 0) pg.ellipse(x, y, r * c, r, 0, Math.PI / 2, -Math.PI / 2, true); else pg.ellipse(x, y, -r * c, r, 0, Math.PI / 2, 3 * Math.PI / 2, false);
  } else {
    pg.arc(x, y, r, Math.PI / 2, 3 * Math.PI / 2);
    if (c > 0) pg.ellipse(x, y, r * c, r, 0, 3 * Math.PI / 2, Math.PI / 2, true); else pg.ellipse(x, y, -r * c, r, 0, -Math.PI / 2, Math.PI / 2, false);
  }
  pg.closePath(); pg.fill();
  pg.strokeStyle = 'rgba(255,255,255,.18)'; pg.lineWidth = 1; pg.beginPath(); pg.arc(x, y, r, 0, TAU); pg.stroke();
}

function updateReadout(atl) {
  // While the clock runs, show the hour only; when paused or dragging, show quarter hours.
  const q = Math.floor((((t % 1) + 1) % 1) * 96), h24 = Math.floor(q / 4), h12 = h24 % 12 || 12, ap = h24 < 12 ? 'am' : 'pm';
  const clock = playing && !drag ? `${h12} ${ap}` : `${h12}:${String((q % 4) * 15).padStart(2, '0')} ${ap}`;
  const isDay = atl[0] > 0;
  const f = phaseFrac(), lit = Math.round((1 - Math.cos(TAU * f)) / 2 * 100);
  const cal = calendar();
  if (fastRunning()) { // above 1x the fine detail just flickers
    els.read1.innerHTML = `<b>${cal.label}</b> (${cal.season})`;
    els.read2.innerHTML = `<b>${phaseName(f)}</b>`;
    return;
  }
  els.read1.innerHTML = `<b>${cal.label}</b> (${cal.season}) · Atlanta <b>${clock}</b> · ${isDay ? 'daylight' : 'night'}`;
  els.read2.innerHTML = `<b>${phaseName(f)}</b> · ${lit}% lit · ${(f * SYNODIC).toFixed(1)} days after new moon`;
}

// ---------- interaction ----------
// Longitude of the point on the Moon's orbital plane under the pointer (orthographic unprojection).
function moonAngleAt(p) {
  const se = Math.sin(elev), ce = Math.cos(elev), n = apply(orbitToWorld(), [0, 0, 1]);
  const sx = (p.x - cx) / Rm, sy = (cy - p.y) / Rm;           // screen right / up, in orbit radii
  const nt = -n[1] * ce + n[2] * se;                          // plane normal along the view direction
  const d = Math.abs(nt) < 0.05 ? 0 : -(sx * n[0] + sy * (n[1] * se + n[2] * ce)) / nt;
  return Math.atan2(sy * se - d * ce, sx);
}
function hit(p) {
  const [mx, my] = toScreen(moonPos(alpha(), orbitToWorld(), nodeLon()), Rm);
  if (Math.hypot(p.x - mx, p.y - my) <= Math.max(Mr + 8, 24)) return 'moon';
  if (Math.hypot(p.x - cx, p.y - cy) <= Re + 6) return 'earth';
  return 'view';
}
sky.addEventListener('pointerdown', (e) => {
  if (e.button !== 0 && e.pointerType === 'mouse') return;
  const p = { x: e.clientX, y: e.clientY };
  drag = { mode: hit(p), x: p.x, y: p.y, a: moonAngleAt(p), id: e.pointerId };
  try { sky.setPointerCapture(e.pointerId); } catch {}
  sky.classList.add('dragging');
});
sky.addEventListener('pointermove', (e) => {
  if (!drag || e.pointerId !== drag.id) return;
  const p = { x: e.clientX, y: e.clientY };
  if (drag.mode === 'moon') {
    const a = moonAngleAt(p); let da = a - drag.a; da -= TAU * Math.round(da / TAU);
    t += da / TAU * SYNODIC; drag.a = a;
  } else if (drag.mode === 'earth') {
    t += (p.x - drag.x) / Re / TAU;
  } else {
    elev = Math.max(0.2, Math.min(1.5, elev + (p.y - drag.y) * 0.006)); layout();
  }
  drag.x = p.x; drag.y = p.y; dirty = true;
});
const endDrag = (e) => { if (drag && e.pointerId === drag.id) { drag = null; sky.classList.remove('dragging'); } };
sky.addEventListener('pointerup', endDrag); sky.addEventListener('pointercancel', endDrag);
sky.addEventListener('wheel', (e) => { e.preventDefault(); elev = Math.max(0.2, Math.min(1.5, elev + e.deltaY * 0.003)); layout(); }, { passive: false });

function setPlaying(v) {
  playing = v; els.icoPlay.toggleAttribute('hidden', v); els.icoPause.toggleAttribute('hidden', !v); els.play.setAttribute('aria-label', v ? 'Pause' : 'Play');
  dirty = true;
}
els.play.addEventListener('click', () => setPlaying(!playing));
function setSpeed(mult) {
  speed = BASE_SPEED * mult; dirty = true;
  els.speedBtns.forEach((b) => b.setAttribute('aria-pressed', String(Number(b.dataset.speed) === mult)));
}
els.speedBtns.forEach((b) => b.addEventListener('click', () => setSpeed(Number(b.dataset.speed))));
els.reset.addEventListener('click', () => { t = T0; elev = 0.6; setSpeed(1); layout(); });
addEventListener('keydown', (e) => {
  if (e.target !== document.body && e.target !== sky) return;
  if (e.code === 'Space') { e.preventDefault(); setPlaying(!playing); }
  else if (e.code === 'ArrowRight') { t += e.shiftKey ? 1 : 1 / 24; dirty = true; }
  else if (e.code === 'ArrowLeft') { t -= e.shiftKey ? 1 : 1 / 24; dirty = true; }
});

// ---------- loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (playing && !drag) { t += speed * dt; dirty = true; }
  if (dirty) { draw(); dirty = false; }
  requestAnimationFrame(frame);
}
addEventListener('resize', resize);
window.__earthMoon = { state: () => ({ t, elev, cx, cy, Re, Rm, Mr, playing, axis: apply(bodyToWorld(), [0, 0, 1]), atl: atlantaWorld(), cal: calendar(), moon: toScreen(moonPos(alpha(), orbitToWorld(), nodeLon()), Rm) }), set: (v) => { if ('t' in v) t = v.t; if ('elev' in v) { elev = v.elev; layout(); } dirty = true; } };
setPlaying(playing); setSpeed(1);
resize();
requestAnimationFrame(frame);
})();
</script>
